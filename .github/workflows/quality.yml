name: Quality checks

on:
  push:
    branches: [main, 'chore/**', 'refactor/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Format source files
        run: npm run format
      - name: Export formatted app source for exact repository formatting
        run: |
          echo "CALX_FORMATTED_APP_BEGIN"
          base64 -w0 app.js | fold -w 2000 | awk '{ printf "CALX_FORMATTED_APP_CHUNK_%04d:%s\n", NR, $0 }'
          echo "CALX_FORMATTED_APP_END"
      - name: Verify formatting
        run: npm run format:check
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check playwright.config.js
          node --check tests/pwa.spec.js
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm test
